<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical CVD Prediction System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f4c81;
            --primary-hover: #1e3a8a;
            --secondary: #e2e8f0;
            --bg-main: #f8fafc;
            --surface-main: #ffffff;
            --surface-border: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #b91c1c;
            --danger-bg: #fee2e2;
            --success: #047857;
            --success-bg: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface-main);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 3rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .header {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 1.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input, select {
            background: var(--surface-main);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
        }

        .predict-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--surface-border);
        }

        button.predict-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            position: relative;
        }

        button.predict-btn:hover {
            background: var(--primary-hover);
        }

        button.predict-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .result-card {
            margin-top: 1.5rem;
            width: 100%;
            padding: 1.5rem;
            border-radius: 6px;
            border: 1px solid var(--surface-border);
            display: none;
        }

        .result-card.active {
            display: block;
        }

        .result-card.high-risk {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .result-card.low-risk {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .result-prob {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .result-desc {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .high-risk .result-title, .high-risk .result-prob, .high-risk .result-desc { color: var(--danger); }
        .low-risk .result-title, .low-risk .result-prob, .low-risk .result-desc { color: var(--success); }

        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            position: absolute;
            left: calc(50% - 8px);
            top: calc(50% - 8px);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading .btn-text {
            opacity: 0;
        }

        .loading .loader {
            display: block;
        }

        .server-selector {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface-main);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border: 1px solid var(--surface-border);
            border-left: 4px solid var(--primary);
        }

        .server-selector select {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Clinical CVD Prediction System</h1>
            <p class="subtitle">High-Accuracy Federated Diagnostic Tool</p>
        </div>

        <div class="form-section">
            <div class="server-selector">
                <label>Target Model Node:</label>
                <select id="serverSelect">
                    <option value="global" style="font-weight: bold; color: var(--primary);">Global Secure Aggregation (RECOMMENDED)</option>
                    <option value="server_1">Node 1 (Partition A)</option>
                    <option value="server_2">Node 2 (Partition B)</option>
                    <option value="server_3">Node 3 (Partition C)</option>
                    <option value="server_4">Node 4 (Partition D)</option>
                    <option value="server_5">Node 5 (Partition E)</option>
                    <option value="server_6">Node 6 (Partition F)</option>
                    <option value="server_7">Node 7 (Partition G)</option>
                    <option value="server_8">Node 8 (Partition H)</option>
                    <option value="server_9">Node 9 (Defective/Poisoned Partition)</option>
                    <option value="server_10">Node 10 (Partition J)</option>
                </select>
            </div>

            <!-- Features -->
            <div class="input-group">
                <label>Age (Years)</label>
                <input type="number" id="age" value="50" min="20" max="100">
            </div>
            
            <div class="input-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="1">Women</option>
                    <option value="2">Men</option>
                </select>
            </div>

            <div class="input-group">
                <label>Height (cm)</label>
                <input type="number" id="height" value="165" min="100" max="250">
            </div>

            <div class="input-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" value="70" min="30" max="250">
            </div>

            <div class="input-group">
                <label>Systolic Blood Pressure</label>
                <input type="number" id="ap_hi" value="120" min="60" max="250">
            </div>

            <div class="input-group">
                <label>Diastolic Blood Pressure</label>
                <input type="number" id="ap_lo" value="80" min="40" max="180">
            </div>

            <div class="input-group">
                <label>Cholesterol</label>
                <select id="cholesterol">
                    <option value="1">Normal (1)</option>
                    <option value="2">Above Normal (2)</option>
                    <option value="3">Well Above Normal (3)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Glucose</label>
                <select id="gluc">
                    <option value="1">Normal (1)</option>
                    <option value="2">Above Normal (2)</option>
                    <option value="3">Well Above Normal (3)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Smoking</label>
                <select id="smoke">
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Alcohol Intake</label>
                <select id="alco">
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>

            <div class="input-group full-width">
                <label>Physical Activity</label>
                <select id="active">
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>

        </div>

        <div class="predict-panel">
            <button class="predict-btn" id="predictBtn" onclick="makePrediction()">
                <span class="btn-text">Execute Clinical Analysis</span>
                <div class="loader"></div>
            </button>

            <div class="result-card" id="resultCard">
                <div class="result-title" id="resultTitle">Analysis Complete</div>
                <div class="result-prob" id="resultProb">--%</div>
                <p class="result-desc" id="resultDesc">Awaiting patient data...</p>
            </div>
        </div>
    </div>

    <script>
        async function makePrediction() {
            const btn = document.getElementById('predictBtn');
            const resultCard = document.getElementById('resultCard');
            
            btn.classList.add('loading');
            btn.disabled = true;
            resultCard.classList.remove('active', 'high-risk', 'low-risk');

            const data = {
                server: document.getElementById('serverSelect').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                ap_hi: document.getElementById('ap_hi').value,
                ap_lo: document.getElementById('ap_lo').value,
                cholesterol: document.getElementById('cholesterol').value,
                gluc: document.getElementById('gluc').value,
                smoke: document.getElementById('smoke').value,
                alco: document.getElementById('alco').value,
                active: document.getElementById('active').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const probPercent = (result.probability * 100).toFixed(1);
                    const isHighRisk = result.prediction === 1;

                    document.getElementById('resultProb').textContent = probPercent + '%';
                    
                    if (isHighRisk) {
                        document.getElementById('resultTitle').textContent = 'High CVD Risk Indicated';
                        document.getElementById('resultDesc').textContent = 'The model indicates a high probability of cardiovascular disease based on the provided clinical metrics. Further diagnostic evaluation is recommended.';
                        resultCard.classList.add('high-risk');
                    } else {
                        document.getElementById('resultTitle').textContent = 'Low CVD Risk Indicated';
                        document.getElementById('resultDesc').textContent = 'The model indicates a low probability of cardiovascular disease. Standard preventive care is advised.';
                        resultCard.classList.add('low-risk');
                    }
                } else {
                    document.getElementById('resultTitle').textContent = 'System Error';
                    document.getElementById('resultProb').textContent = 'N/A';
                    document.getElementById('resultDesc').textContent = result.error || 'Failed to process clinical data.';
                    resultCard.classList.add('high-risk');
                }
            } catch (error) {
                document.getElementById('resultTitle').textContent = 'Connection Error';
                document.getElementById('resultProb').textContent = 'N/A';
                document.getElementById('resultDesc').textContent = 'Could not establish connection to the inference server.';
                resultCard.classList.add('high-risk');
            }

            btn.classList.remove('loading');
            btn.disabled = false;
            resultCard.classList.add('active');
        }
    </script>
</body>
</html>
